<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malcom's Barbershop</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">Malcom's Barbershop</div>
        <div class="nav-links">
            <a href="index.html" class="nav-link">Home</a>
            <a href="booking.html" class="nav-link">Book Now</a>
            <a href="#services" class="nav-link">Services</a>
        </div>
    </nav>

    <section class="hero">
        <div class="hero-content">
            <h1> Welcome to Malcoms</h1>
            <p class="hero-subtitle">Where Classic Style Meets Modern Elegance</p>
            <a href="booking.html" class="btn">Book Appointment <i class="fas fa-chevron-right"></i></a>
        </div>
    </section>

    <section class="services" id="services">
        <h2 class="section-title">Our Services</h2>
        <div class="service-grid">
            <div class="service-card">
                <i class="service-icon fas fa-cut"></i>
                <h3>Classic Cut</h3>
                <p>Traditional barbering with modern precision</p>
                <div class="price-tag">$45+</div>
            </div>
            <!-- Add other service cards -->
        </div>
    </section>

    <script src="script.js"></script>

</html>
