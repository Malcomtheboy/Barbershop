<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Registration - Malcom's</title>
    <link rel="stylesheet" href="reg.css">
</head>
<body>
    <nav class="navbar">
        <a href="Barbershop.html" class="logo">Malcom's</a>
        <div class="nav-links">
            <a href="Barbershop.html">Home</a>
            <a href="booking.html">Book Now</a>
        </div>
    </nav>

    <div class="registration-container">
        <div class="decorative-side">
            <div class="quote-box">
                <h3>"Precision Craftsmanship Since 1998"</h3>
                <div class="divider" style="width: 50px; height: 2px; background: var(--gold-accent); margin: 2rem 0;"></div>
                <p>Your journey to exceptional grooming is almost complete</p>
            </div>
        </div>

        <div class="form-side">
            <div class="progress-steps">
                <div class="step">1</div>
                <div class="step">2</div>
                <div class="step">3</div>
            </div>
            
            <div class="registration-header">
                <h2>Complete Your Booking</h2>
                <p>Final step to secure your premium grooming experience</p>
            </div>

            <form id="registrationForm">
                <div class="form-group">
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="name" placeholder="Full Name" required>
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-wrapper">
                        <i class="fas fa-phone"></i>
                        <input type="tel" id="phone" placeholder="Phone Number" required maxlength="12">
                    </div>
                    <small class="form-text text-muted"></small>
                </div>

                <div class="form-group">
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" placeholder="Email Address" required>
                    </div>
                </div>

                <button type="submit">Confirm Details <i class="fas fa-chevron-right"></i></button>
            </form>

            <div class="trust-badge">
                <i class="fas fa-lock"></i> Your information is securely protected
            </div>
        </div>
    </div>

    <script src="reg.js"></script>
</body>
</html>
